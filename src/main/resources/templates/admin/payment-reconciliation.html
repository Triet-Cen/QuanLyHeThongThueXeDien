<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragment/layout :: layout('Đối soát VNPay','reconciliation',~{::#review})}">
<body><main id="review" class="rental-workspace">
    <header class="work-heading"><h2>Giao dịch cần đối soát</h2><span th:text="|${events.size()} giao dịch gần nhất|"></span></header>
    <p class="empty-state" th:if="${events.empty}">Chưa có giao dịch cần đối soát.</p>
    <article class="work-card" th:each="e : ${events}">
        <header class="work-heading"><div><strong th:text="|Đơn thuê DT${e.rental}|"></strong>
            <small th:text="|Giao dịch #${e.ref}|"></small></div><time th:text="${e.received_at}"></time></header>
        <dl class="facts">
            <div><dt>Số tiền hóa đơn</dt><dd th:text="|${#numbers.formatDecimal(e.expected,1,'POINT',0,'COMMA')} đ|"></dd></div>
            <div><dt>Mã VNPay</dt><dd th:text="${e.provider_id ?: '—'}"></dd></div>
        </dl>
        <p class="reason"><strong>Thông tin đối soát</strong> <span th:text="${e.disposition ?: 'Cần kiểm tra giao dịch tại VNPay.'}"></span></p>
        <p th:if="${e.resolution}" class="review-note"><strong>Ghi nhận gần nhất</strong> <span th:text="${e.resolution}"></span></p>
        <details class="note-editor"><summary>Ghi nhận xử lý</summary>
            <form method="post" th:action="@{/admin/payments/reconciliation/{id}/notes(id=${e.event_id})}">
                <label>Nội dung xử lý<textarea name="note" rows="2" required maxlength="900"></textarea></label>
                <button class="admin-button">Lưu ghi nhận</button>
            </form>
        </details>
    </article>
</main></body></html>
