<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/fragment/layout :: layout('Đơn thuê xe','rentals',~{::#rentals})}">
<body><section id="rentals" class="rental-workspace">
<header class="work-heading"><h2>Danh sách đơn thuê</h2><span th:text="|${results.total} đơn|"></span></header>
<form class="work-card filters" method="get" th:action="@{/admin/rentals}">
<label>Tìm đơn, khách hoặc biển số <input type="search" placeholder="Mã đơn, tên khách, email, biển số…" name="q" th:value="${param.q}"></label>
<label>Trạm nhận <select name="station"><option value="">Tất cả</option><option th:each="s : ${stations}" th:value="${s.MaTram}" th:text="${s.TenTram}" th:selected="${param.station != null and param.station[0]==s.MaTram.toString()}"></option></select></label>
<label>Trạng thái <select name="status"><option value="">Tất cả</option><option th:each="s : ${statuses}" th:value="${s.key}" th:text="${s.value}" th:selected="${param.status != null and param.status[0]==s.key}"></option></select></label>
<label>Lọc theo <select name="basis"><option value="created" th:selected="${param.basis != null and param.basis[0]=='created'}">Ngày tạo đơn</option><option value="pickup" th:selected="${param.basis != null and param.basis[0]=='pickup'}">Ngày nhận dự kiến</option></select></label>
<label>Từ ngày <input type="date" name="from" th:value="${param.from}"></label>
<label>Đến hết ngày <input type="date" name="to" th:value="${param.to}"></label>
<label>Cần xử lý <select name="flag"><option value="" th:selected="${param.flag != null and param.flag[0]==''}">Tất cả</option><option value="expired" th:selected="${param.flag != null and param.flag[0]=='expired'}">Hết giữ lịch</option><option value="fees" th:selected="${param.flag != null and param.flag[0]=='fees'}">Còn phí</option><option value="review" th:selected="${param.flag != null and param.flag[0]=='review'}">Đối soát</option><option value="newRefund" th:selected="${param.flag != null and param.flag[0]=='newRefund'}">Yêu cầu hoàn mới</option><option value="refund" th:selected="${param.flag != null and param.flag[0]=='refund'}">Chờ hoàn</option><option value="dispatch" th:selected="${param.flag != null and param.flag[0]=='dispatch'}">Điều phối</option></select></label>
<div class="filter-actions"><button class="admin-button">Lọc đơn</button> <a th:href="@{/admin/rentals}">Xóa bộ lọc</a></div></form>
<p class="empty-state" th:if="${results.rows.empty}">Không tìm thấy đơn phù hợp.</p>
<div class="work-card table-card admin-table-wrap" th:unless="${results.rows.empty}"><table class="admin-table"><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Xe</th><th>Nhận dự kiến</th><th>Trả dự kiến</th><th>Ngày tạo</th><th>Tiền thuê chốt (đ)</th><th>Trạng thái</th><th>Cảnh báo</th></tr></thead>
<tbody><tr th:each="r : ${results.rows}"><td th:text="|DT${r.MaDonThue}|"></td>
<td><strong th:text="${r.HoTen}"></strong><small th:text="${r.Email}"></small></td><td><strong th:text="${r.TenMauXe+' · '+r.BienSo}"></strong><small th:text="${r.TenTram}"></small></td><td class="schedule-time"><strong th:text="${r.pickupDate}"></strong><small th:text="${r.pickupTime}"></small></td><td class="schedule-time"><strong th:text="${r.returnDate}"></strong><small th:text="${r.returnTime}"></small></td><td th:text="${r.NgayTao}"></td><td th:text="${#numbers.formatDecimal(r.TongTienThue,1,'POINT',0,'COMMA')}"></td>
<td><span th:replace="~{admin/fragment/rental-status :: badge(${r.TrangThaiDon})}"></span></td>
<td th:text="${r.warning}"></td>
</tr></tbody></table></div>
<nav class="pager" aria-label="Phân trang"><a th:if="${page>1}" th:href="@{/admin/rentals(q=${param.q},station=${param.station},status=${param.status},basis=${param.basis},from=${param.from},to=${param.to},flag=${param.flag},size=${size},page=${page - 1})}">Trang trước</a>
<span th:text="|Trang ${page} · ${results.total} đơn|"></span>
<a th:if="${page.longValue()*size < results.total}" th:href="@{/admin/rentals(q=${param.q},station=${param.station},status=${param.status},basis=${param.basis},from=${param.from},to=${param.to},flag=${param.flag},size=${size},page=${page + 1})}">Trang sau</a></nav>
</section></body></html>
