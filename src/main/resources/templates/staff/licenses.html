<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Giấy phép lái xe | E-Vehicle Rental</title><link rel="stylesheet" th:href="@{/css/customer.css}"><link rel="stylesheet" th:href="@{/css/profile.css}"><link rel="stylesheet" th:href="@{/css/license.css}"></head><body class="customer-page license-page"><nav class="customer-navbar"><a th:href="@{/staff/licenses}" class="brand-link">Xác minh GPLX</a><div class="customer-menu"><a th:href="@{/home}">Trang chủ</a><a th:href="@{/staff/licenses}">Danh sách GPLX</a><form method="post" th:action="@{/logout}"><button class="btn-ghost">Đăng xuất</button></form></div></nav>
<main class="customer-container profile-container"><header class="profile-heading"><div><p class="profile-eyebrow">NHÂN VIÊN</p><h1>Xác minh GPLX</h1><p>Kiểm tra hồ sơ và đối chiếu giấy phép khách cung cấp.</p></div></header>
<div class="profile-panel"><p th:if="${#lists.isEmpty(licenses)}">Chưa có GPLX được gửi.</p>
<div class="license-table-wrap"><table class="license-table" th:unless="${#lists.isEmpty(licenses)}"><thead><tr><th>Khách hàng</th><th>Số GPLX</th><th>Ngày hết hạn</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="license : ${licenses}"><td><strong th:text="${license.customer.fullName}"></strong><br><span th:text="${license.customer.account.email}"></span></td><td th:text="${license.licenseNumber}"></td><td th:text="${#temporals.format(license.expiryDate, 'dd/MM/yyyy')}"></td><td th:text="${license.verificationStatus}"></td><td><a class="btn-ghost" th:href="@{/staff/licenses/{id}(id=${license.licenseId})}">Kiểm tra</a></td></tr>
</tbody></table></div></div></main></body></html>
