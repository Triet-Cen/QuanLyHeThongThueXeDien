<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Giấy phép lái xe | E-Vehicle Rental</title><link rel="stylesheet" th:href="@{/css/customer.css}"><link rel="stylesheet" th:href="@{/css/profile.css}"><link rel="stylesheet" th:href="@{/css/license.css}"></head><body class="customer-page license-page"><nav class="customer-navbar"><a th:href="@{/staff/licenses}" class="brand-link">Xác minh GPLX</a><div class="customer-menu"><a th:href="@{/home}">Trang chủ</a><a th:href="@{/staff/licenses}">Danh sách GPLX</a><form method="post" th:action="@{/logout}"><button class="btn-ghost">Đăng xuất</button></form></div></nav>
<main class="customer-container profile-container"><a th:href="@{/staff/licenses}">← Danh sách GPLX</a>
<header class="profile-heading"><div><p class="profile-eyebrow">NHÂN VIÊN</p><h1>Kiểm tra giấy phép lái xe</h1></div></header>
<p class="profile-alert profile-alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
<p class="license-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
<section class="profile-panel"><p>Trạng thái: <strong th:text="${license.verificationStatus}"></strong></p><p th:if="${license.verifiedAt != null}">Thời điểm xác minh: <span th:text="${#temporals.format(license.verifiedAt, 'dd/MM/yyyy HH:mm')}"></span></p>
<dl class="license-details"><dt>Khách hàng</dt><dd th:text="${license.customer.fullName}"></dd><dt>Email</dt><dd th:text="${license.customer.account.email}"></dd><dt>Số điện thoại</dt><dd th:text="${license.customer.phone}"></dd><dt>Số GPLX</dt><dd th:text="${license.licenseNumber}"></dd><dt>Hạng</dt><dd th:text="${license.licenseClass}"></dd><dt>Ngày cấp</dt><dd th:text="${#temporals.format(license.issueDate, 'dd/MM/yyyy')}"></dd><dt>Ngày hết hạn</dt><dd th:text="${#temporals.format(license.expiryDate, 'dd/MM/yyyy')}"></dd></dl>
<img class="license-image" th:src="@{/staff/licenses/{id}/image(id=${license.licenseId})}" alt="Ảnh GPLX khách cung cấp">
<p>Đối chiếu thông tin và giấy phép thực tế, kiểm tra hạng B và hạn sử dụng trước khi ghi nhận kết quả.</p>
<form class="profile-form" method="post" th:action="@{/staff/licenses/{id}(id=${license.licenseId})}" th:if="${license.verificationStatus != 'Từ chối'}">
<input type="hidden" name="expectedImage" th:value="${license.imagePath}">
<div class="license-actions"><button class="profile-save-button" name="decision" value="Đã xác minh" th:if="${license.verificationStatus == 'Chưa xác minh'}">Đã xác minh</button>
<button class="btn-ghost" name="decision" value="Từ chối">Từ chối</button></div>
</form></section></main></body></html>
